[supervisord]
nodaemon=true
logfile=/data/logs/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/data/logs

[program:postgres]
command=/usr/lib/postgresql/15/bin/postgres -D /data/postgres
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/data/logs/postgres.log
stderr_logfile=/data/logs/postgres.log

[program:backend]
command=/app/start-backend.sh
user=byaan
directory=/app/server
autostart=true
autorestart=true
startsecs=10
startretries=3
priority=20
stdout_logfile=/data/logs/backend.log
stderr_logfile=/data/logs/backend.log
environment=PYTHONPATH="/app",HOME="/home/byaan"

[program:caddy]
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile
autostart=true
autorestart=true
priority=30
stdout_logfile=/data/logs/caddy.log
stderr_logfile=/data/logs/caddy.log
