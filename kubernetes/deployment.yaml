apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-hosted
  namespace: byaan
  labels:
    app.kubernetes.io/name: byaan
    app.kubernetes.io/component: self-hosted
    app.kubernetes.io/managed-by: autopoc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: byaan
      app.kubernetes.io/component: self-hosted
  template:
    metadata:
      labels:
        app.kubernetes.io/name: byaan
        app.kubernetes.io/component: self-hosted
    spec:
      containers:
        - name: self-hosted
          image: quay.io/aicatalyst/byaan-self-hosted:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            # Plain environment variables
            - name: APP_MODE
              value: "self-hosted"
            - name: BYAAN_DEFAULT_LLM_PROVIDER
              value: "openai"
            - name: BYAAN_DEFAULT_LLM_MODEL
              value: "gpt-4o-mini"
            # WORKER_URL pointing to itself (all-in-one container)
            - name: WORKER_URL
              value: "http://localhost:8000"
            # Sensitive environment variables from Secret
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: self-hosted-secrets
                  key: ENCRYPTION_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: self-hosted-secrets
                  key: OPENAI_API_KEY
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: self-hosted-secrets
                  key: APP_SECRET
          resources:
            requests:
              memory: "4Gi"
              cpu: "2000m"
            limits:
              memory: "8Gi"
              cpu: "4000m"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: self-hosted-data
