name: Promote to Stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote to stable (e.g., 1.0.3 without 'v' prefix)"
        required: true
        type: string

env:
  REGISTRY: docker.io
  SERVER_IMAGE: byaan/server
  CLIENT_IMAGE: byaan/client

jobs:
  promote:
    name: Promote to Stable
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $VERSION"
            echo "Expected format: X.Y.Z (e.g., 1.0.3)"
            exit 1
          fi
          echo "✓ Version format valid: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check if version exists
        run: |
          VERSION="${{ inputs.version }}"
          echo "Checking if version $VERSION exists..."

          if ! docker manifest inspect ${{ env.SERVER_IMAGE }}:${VERSION}-amd64 > /dev/null 2>&1; then
            echo "❌ Server image not found: ${{ env.SERVER_IMAGE }}:${VERSION}-amd64"
            exit 1
          fi

          if ! docker manifest inspect ${{ env.CLIENT_IMAGE }}:${VERSION}-amd64 > /dev/null 2>&1; then
            echo "❌ Client image not found: ${{ env.CLIENT_IMAGE }}:${VERSION}-amd64"
            exit 1
          fi

          echo "✓ Version $VERSION exists on Docker Hub"

      - name: Promote Server to stable
        run: |
          VERSION="${{ inputs.version }}"
          echo "Promoting ${{ env.SERVER_IMAGE }}:$VERSION to stable..."

          docker buildx imagetools create \
            --tag ${{ env.SERVER_IMAGE }}:stable \
            ${{ env.SERVER_IMAGE }}:${VERSION}-amd64 \
            ${{ env.SERVER_IMAGE }}:${VERSION}-arm64

          echo "✓ Promoted ${{ env.SERVER_IMAGE }}:stable"

      - name: Promote Client to stable
        run: |
          VERSION="${{ inputs.version }}"
          echo "Promoting ${{ env.CLIENT_IMAGE }}:$VERSION to stable..."

          docker buildx imagetools create \
            --tag ${{ env.CLIENT_IMAGE }}:stable \
            ${{ env.CLIENT_IMAGE }}:${VERSION}-amd64 \
            ${{ env.CLIENT_IMAGE }}:${VERSION}-arm64

          echo "✓ Promoted ${{ env.CLIENT_IMAGE }}:stable"

      - name: Print summary
        run: |
          VERSION="${{ inputs.version }}"
          echo ""
          echo "=== Promotion Complete ==="
          echo ""
          echo "Version $VERSION has been promoted to stable:"
          echo "  - ${{ env.SERVER_IMAGE }}:stable"
          echo "  - ${{ env.CLIENT_IMAGE }}:stable"
          echo ""
          echo "Both images support: linux/amd64, linux/arm64"
